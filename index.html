<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Library — for Candice 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 3D Scene -->
  <div id="canvas-container"></div>

  <!-- Candlelight overlay -->
  <canvas id="flicker-overlay"></canvas>

  <!-- ===================== FALLBACK (no WebGL / mobile) ===================== -->
  <div id="fallback-library" class="fallback-library hidden">
    <h1 class="fallback-title">📚 Our Library</h1>
    <p class="fallback-sub">A candlelit collection of our love</p>
    <div class="fallback-grid" id="fallbackBookGrid"></div>
  </div>

  <!-- ===================== BOOK OVERLAY (opens when book picked up) ===================== -->
  <div id="book-overlay" class="book-overlay hidden">
    <button id="close-book" class="btn-close" aria-label="Close book">✕</button>
    <div id="book-cover" class="book-cover">
      <div class="cover-front">
        <h2 id="book-title-cover"></h2>
        <p id="book-author">for Candice</p>
        <p class="tap-hint">Tap to open</p>
      </div>
      <div class="cover-spine"></div>
    </div>
    <div id="book-pages" class="book-pages hidden">
      <div class="page-spread">
        <div class="page left-page" id="page-left">
          <div class="page-content" id="page-left-content"></div>
        </div>
        <div class="page-center">
          <div class="page-flip left-flip"></div>
          <div class="page-flip right-flip"></div>
        </div>
        <div class="page right-page" id="page-right">
          <div class="page-content" id="page-right-content"></div>
        </div>
      </div>
      <div class="page-nav">
        <button id="prev-page" class="btn-nav">← Previous</button>
        <span id="page-counter" class="page-counter"></span>
        <button id="next-page" class="btn-nav">Next →</button>
      </div>
    </div>
  </div>

  <!-- Audio enable button (mobile) -->
  <button id="enable-audio" class="audio-btn">🔊 Enable Ambient Sound</button>

  <!-- Ambient audio (optional) -->
  <audio id="ambient-audio" loop preload="auto" style="display:none">
    <source src="assets/ambient.mp3" type="audio/mpeg">
  </audio>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
